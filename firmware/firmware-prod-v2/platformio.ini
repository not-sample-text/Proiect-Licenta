; ; PlatformIO configuration for the PROS3 Macropad
; https://docs.platformio.org/page/projectconf.html

[env:pros3]
platform = espressif32
board = um_pros3
framework = arduino

; ── Build ────────────────────────────────────────────────────────
build_flags =
    -DARDUINO_USB_MODE=1        ; Native USB (TinyUSB via Arduino)
    -DARDUINO_USB_CDC_ON_BOOT=1 ; CDC Serial available at boot
    -DDEBUG_LEVEL=3             ; 0=OFF  1=ERROR  2=WARN  3=INFO  4=VERBOSE
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DUSE_TINYUSB              ; Enable TinyUSB stack for USB HID

; ── Serial Monitor ───────────────────────────────────────────────
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ── Partitions ───────────────────────────────────────────────────
; Default partition with a small SPIFFS/LittleFS region for config.json
board_build.partitions = default.csv
board_build.filesystem = littlefs

; ── Libraries ───────────────────────────────────────────────────
lib_deps =
    olikraus/U8g2 @ ^2.35.19
    fastled/FastLED @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.2.1
    h2zero/NimBLE-Arduino @ ^1.4.1
