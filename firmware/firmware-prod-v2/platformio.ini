[env:um_pros3]
platform = espressif32
board = um_pros3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DARDUINO_USB_MODE=0            ; Routes hardware to USB-Serial-JTAG
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Ensures virtual COM port persists
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DBOARD_HAS_PSRAM               ; Correct flag for ESP32-S3

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit NeoPixel @ ^1.11.0
    h2zero/NimBLE-Arduino @ ^1.4.1
    bblanchon/ArduinoJson @ ^7.0.0  ; Added for JSON parsing engine
