name: Build ApexPad Executables

on:
    push:
        branches: ["main", "master"]
    workflow_dispatch: # This adds a "Run workflow" button in the GitHub UI

jobs:
    build:
        name: Build on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [windows-latest, ubuntu-latest, macos-latest]

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Dependencies
              # Make sure to cd into your python folder if it's not in the repo root
              run: |
                  python -m pip install --upgrade pip
                  pip install pyserial pystray pillow pyinstaller

            - name: Build Executable
              # Adjust the 'cd' command if your main.py is inside a subfolder like host-listener/
              run: |
                  cd host-listener
                  pyinstaller --noconsole --onefile --name ApexPad main.py

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ApexPad-Binary-${{ runner.os }}
                  path: host-listener/dist/*
